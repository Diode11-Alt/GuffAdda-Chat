version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chatapp-postgres
    environment:
      POSTGRES_DB: chatdb
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: chatapp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-strongpassword}
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
