name: Test

on:
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chatdb
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './chat-app-backend/package-lock.json'
          
      - name: Install Dependencies
        working-directory: ./chat-app-backend
        run: npm ci || npm install
        
      # - name: Run Tests
      #   working-directory: ./chat-app-backend
      #   run: npm run test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './chat-app-mobile/package-lock.json'
          
      - name: Install Dependencies
        working-directory: ./chat-app-mobile
        run: npm ci || npm install
        
      # - name: Run Tests
      #   working-directory: ./chat-app-mobile
      #   run: npm run test
